# Runs on every PR and on main. Vercel deploys main on its own; this workflow
# only answers "is it correct?" so a red check means: do not merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (testes + dados em dia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      # raw StatsBomb JSON and the Inter font, downloaded once and reused between runs
      - uses: actions/cache@v4
        with:
          path: engine/.cache
          key: statsbomb-${{ hashFiles('engine/config/*.yaml') }}

      - name: Instalar o engine
        run: pip install -e "engine[dev,report]"

      - name: Testes (regras, regressão da final e da campanha, post)
        run: pytest engine/tests

      - name: JSONs do site batem com um export novo
        run: python -m pnsm check --config engine/config/wc1970_brazil.yaml

  site:
    name: Site (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
